# simple-router example configuration (reference for every setting).
#
# For a fresh setup, generate one instead of copying this file:
#   simple-router init                           # master.key + config.yaml + admin key
#   export SIMPLE_ROUTER_MASTER_KEY_FILE=$PWD/master.key
#   simple-router provider add openai --base-url https://api.openai.com/v1   # prompts for the key
#   simple-router key add my-app --models 'openai/*'                          # prints the client key
#   simple-router serve
#
# The enc:v1:/sha256: values below are placeholders; create real ones with the helpers above.
# master_key_check (written by init / provider add) makes every command reject a wrong master key.

server:
  listen: ":8080"
  request_timeout: 5m      # whole request, including all failover attempts
  max_body_bytes: 33554432 # 32 MiB
  sticky_ttl: 10m          # how long a conversation stays pinned to a provider (sliding); negative disables
  failure_cooldown: 30s    # a failed target is deprioritised for this long
  health_interval: 60s     # background provider probes; 0 disables
  health_timeout: 10s
  tls:
    mode: off                    # off | file | self-signed
    # file: a certificate written by any tool (lego, certbot, cert-manager...),
    # re-read live when it changes. Until it exists and is valid, a self-signed
    # fallback is served (fallback_self_signed: false to fail instead).
    # cert_file: tls/tls.crt     # relative to this file's directory
    # key_file: tls/tls.key
    # self-signed: generated, stored in dir, renewed before expiry. Covers
    # localhost, 127.0.0.1 and ::1, plus:
    # domains: [router.lan]
    # dir: tls                   # where self-signed certificates are stored (default: tls)
    # http_listen: ":80"         # optional plain-HTTP listener that redirects to HTTPS
    # min_version: "1.2"         # or "1.3"

providers:
  - name: openai
    base_url: https://api.openai.com/v1
    api_key: enc:v1:REPLACE_ME
  - name: openrouter
    base_url: https://openrouter.ai/api/v1
    api_key: enc:v1:REPLACE_ME
    headers:
      X-Title: simple-router
  - name: azure
    base_url: https://my-resource.openai.azure.com/openai/v1
    api_key: enc:v1:REPLACE_ME
    auth_header: api-key
    auth_scheme: none       # send the raw key, no "Bearer "
  - name: cohere
    base_url: https://api.cohere.com/v2
    api_key: enc:v1:REPLACE_ME
    paths:
      rerank: /rerank
      health: /models
  - name: local-vllm         # no api_key: no auth header is sent
    base_url: http://localhost:8000/v1

models:
  - name: openai/gpt-4o      # the id clients send
    type: chat               # chat (default) | embedding | rerank
    targets:
      - { provider: openai, model: gpt-4o,        priority: 1 }  # 1 and 1: round robin
      - { provider: azure,  model: gpt-4o,        priority: 1 }
      - { provider: openrouter, model: openai/gpt-4o, priority: 2 }  # fallback

  - name: openai/text-embedding-3-small
    type: embedding
    targets:
      - { provider: openai, model: text-embedding-3-small, priority: 1 }
      - { provider: openrouter, model: openai/text-embedding-3-small, priority: 2 }

  - name: cohere/rerank-v3.5
    type: rerank
    targets:
      - { provider: cohere, model: rerank-v3.5 }

  - name: local/llama
    targets:
      - { provider: local-vllm, model: meta-llama/Llama-3.1-8B-Instruct }

api_keys:
  - name: admin
    hash: sha256:REPLACE_WITH_64_HEX_CHARS_FROM_simple-router_apikey_000000000000000
    models: ["*"]
    admin: true              # may call GET /admin/health
  - name: rag-service
    hash: sha256:REPLACE_WITH_64_HEX_CHARS_FROM_simple-router_apikey_000000000000000
    models: ["openai/text-embedding-*", "cohere/*"]   # glob patterns
