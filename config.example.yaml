# simple-router example configuration (reference for every setting).
#
# For a fresh setup, generate one instead of copying this file:
#   simple-router init                           # master.key + config.yaml + admin key
#   export SIMPLE_ROUTER_MASTER_KEY_FILE=$PWD/master.key
#   simple-router provider add openai --base-url https://api.openai.com/v1   # prompts for the key
#   simple-router key add my-app --models 'openai/*'                          # prints the client key
#   simple-router serve
#
# The enc:v1:/sha256: values below are placeholders; create real ones with the helpers above.
# master_key_check (written by init / provider add) makes every command reject a wrong master key.

server:
  listen: ":8080"
  request_timeout: 5m      # whole request, including all failover attempts
  max_body_bytes: 33554432 # 32 MiB
  sticky_ttl: 10m          # how long a conversation stays pinned to a provider (sliding); negative disables
  failure_cooldown: 30s    # a failed target is deprioritised for this long
  health_interval: 60s     # background provider probes; 0 disables
  health_timeout: 10s
  # Client IP allowlist for every route (API, /provider/, /admin/, /healthz). CIDRs or
  # bare IPs; empty or omitted allows everyone. Loopback is always allowed. Applied
  # on reload. Peers not listed are dropped at connect time, before the TLS handshake.
  # allow_cidrs:
  #   - 10.0.0.0/8
  #   - 192.168.0.0/16
  #   - fd00::/8
  # Reverse proxies whose X-Forwarded-For is trusted: the client is the right-most
  # entry that is not itself a trusted proxy. Without this, X-Forwarded-For is ignored.
  # trusted_proxies:
  #   - 172.18.0.2
  tls:
    mode: off                    # off | file | self-signed | acme
    # file: a certificate written by any tool (lego, certbot, cert-manager...),
    # re-read live when it changes. Until it exists and is valid, a self-signed
    # fallback is served (fallback_self_signed: false to fail instead).
    # cert_file: tls/tls.crt     # relative to this file's directory
    # key_file: tls/tls.key
    # self-signed: generated, stored in dir, renewed before expiry. Covers
    # localhost, 127.0.0.1 and ::1, plus:
    # domains: [router.lan]
    # dir: tls                   # where self-signed certificates are stored (default: tls)
    # http_listen: ":80"         # optional plain-HTTP listener that redirects to HTTPS
    # min_version: "1.2"         # or "1.3"
    # acme: the router runs lego (v5, from PATH or --lego; the -acme image has it)
    # to obtain and renew a certificate from Let's Encrypt or any ACME CA. A
    # self-signed fallback is served until the first certificate is issued.
    # acme:
    #   email: admin@example.com
    #   domains: [router.example.com]    # wildcards need challenge dns
    #   server: letsencrypt              # letsencrypt-staging, zerossl, or a directory URL
    #   # ca_file: /path/ca.pem          # to trust a private ACME server (step-ca...)
    #   key_type: EC256                  # EC384, RSA2048, RSA3072, RSA4096
    #   challenge: dns                   # dns (default) | http (needs http_listen on port 80)
    #   dns_provider: cloudflare         # lego provider code; `lego dnshelp` lists them
    #   dns_env:                         # set with `simple-router acme env set NAME` (encrypted)
    #     CLOUDFLARE_DNS_API_TOKEN: enc:v1:REPLACE_ME
    #   # dns_resolvers: ["1.1.1.1:53"]
    #   # dns_propagation_wait: 0s
    #   # check_interval: 12h            # how often lego checks for renewal

providers:
  - name: openai
    base_url: https://api.openai.com/v1
    external: true
    api_key: enc:v1:REPLACE_ME
  - name: openrouter
    base_url: https://openrouter.ai/api/v1
    api_key: enc:v1:REPLACE_ME
    external: true           # outside this deployment: skipped for requests forwarded by a peer
    headers:
      X-Title: simple-router
  - name: azure
    base_url: https://my-resource.openai.azure.com/openai/v1
    external: true
    api_key: enc:v1:REPLACE_ME
    auth_header: api-key
    auth_scheme: none       # send the raw key, no "Bearer "
  - name: cohere
    base_url: https://api.cohere.com/v2
    external: true
    api_key: enc:v1:REPLACE_ME
    paths:
      rerank: /rerank
      health: /models
  - name: local-vllm         # no api_key: no auth header is sent
    base_url: http://localhost:8000/v1
  - name: anthropic          # Anthropic Messages API (models of type: messages)
    base_url: https://api.anthropic.com/v1
    external: true
    api_key: enc:v1:REPLACE_ME
    auth_header: x-api-key
    auth_scheme: none
  - name: opencode-go        # OpenCode Go subscription
    base_url: https://opencode.ai/zen/go/v1
    external: true
    api_key: enc:v1:REPLACE_ME
    session_header: X-Opencode-Session   # required: a per-conversation id is sent in it
    base_urls:                           # same host, other prefix: System One (jev-*) models
      systemone: https://opencode.ai/inference/systemone/v1
  - name: opencode-go-pass   # /provider/opencode-go-pass/<path>, forwarded unchanged with the
    base_url: https://opencode.ai/zen/go/v1    # client's own key; the router checks nothing
    auth: passthrough                          # (trusted networks / server.allow_cidrs)
    external: true
    session_header: X-Opencode-Session
  - name: router-b           # another simple-router: client credentials are forwarded
    base_url: https://router-b.lan:8443/v1     # (no api_key); one hop, local targets only; probed
    peer: true                                 # at https://router-b.lan:8443/healthz
    # ca_file: /etc/sr/router-b.pem            # trust only this PEM (pin a self-signed certificate)
  - name: llama-swap         # managed (default): /provider/llama-swap/<path> needs a router key
    base_url: http://127.0.0.1:8080            # whose `providers` grant it; no stored key here
    allow_paths: ["/v1/*", "/upstream/*", "/running"]   # keep /unload, /logs and the UI out

models:
  - name: openai/gpt-4o      # the id clients send
    type: chat               # chat (default) | embedding | rerank | messages | systemone
    targets:
      - { provider: openai, model: gpt-4o,        priority: 1 }  # 1 and 1: round robin
      - { provider: azure,  model: gpt-4o,        priority: 1 }
      - { provider: openrouter, model: openai/gpt-4o, priority: 2 }  # fallback

  - name: openai/text-embedding-3-small
    aliases: [text-embedding-3-small]   # other ids clients may send (same routing)
    type: embedding
    targets:
      - { provider: openai, model: text-embedding-3-small, priority: 1 }
      - { provider: openrouter, model: openai/text-embedding-3-small, priority: 2 }

  - name: cohere/rerank-v3.5
    type: rerank
    targets:
      - { provider: cohere, model: rerank-v3.5 }

  - name: claude-sonnet-4-5   # POST /v1/messages (Anthropic format, no conversion)
    type: messages
    targets:
      - { provider: anthropic, model: claude-sonnet-4-5 }

  - name: jev-1.13           # POST /v1/systemone (System One decisions)
    type: systemone
    targets:
      - { provider: opencode-go, model: jev-1.13-free, priority: 1 }  # free tier first
      - { provider: opencode-go, model: jev-1.13,      priority: 2 }  # paid fallback

  - name: local/llama
    targets:
      - { provider: local-vllm, model: meta-llama/Llama-3.1-8B-Instruct }
      - { provider: router-b, priority: 2 }   # peer: model defaults to this model's name

api_keys:
  - name: admin
    hash: sha256:REPLACE_WITH_64_HEX_CHARS_FROM_simple-router_apikey_000000000000000
    models: ["*"]
    admin: true              # may call GET /admin/health
    providers: ["*"]         # may use /provider/<name>/ (managed providers; default: none)
  - name: rag-service
    hash: sha256:REPLACE_WITH_64_HEX_CHARS_FROM_simple-router_apikey_000000000000000
    models: ["openai/text-embedding-*", "cohere/*"]   # glob patterns
  - name: private-notes
    hash: sha256:REPLACE_WITH_64_HEX_CHARS_FROM_simple-router_apikey_000000000000000
    disable_external: true   # never sent to external providers (peers serve it locally)
